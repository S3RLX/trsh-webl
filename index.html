<body class="loading">

<!-- Preloader -->
<div id="preloader" class="preloader">
  <div class="pl-in">
    <span class="mono" id="plText">TRSH</span>
    <b id="plNum">000</b>
    <i class="pl-bar"><u id="plBar"></u></i>
  </div>
</div>

<!-- Overlays -->

<div class="scan"></div>

<!-- Announcement -->
<div id="announce" class="announce mono" hidden></div>
<div id="promo" class="promo mono" hidden></div>

<!-- Navbar -->
<header id="nav" class="nav">
  <a href="#top" class="logo" id="logo"></a>
  <nav class="links mono" id="links"></nav>
  <div class="acts mono">
    <button class="ab menu" data-act="menu" id="menuBtn" aria-label="Menu" aria-expanded="false" hidden>☰</button>
    <button class="ab" data-act="wishlist" id="wishBtn" aria-label="Saved">♡ <b id="wishN">0</b></button>
    <button class="ab" data-act="cart" id="cartBtn" aria-label="Bag">BAG <b id="cartN">0</b></button>

<main id="top">
  <section id="hero" class="hero"></section>
  <div id="marquee" class="marquee mono"></div>
  <section id="drop" class="sec drop"></section>

  <section id="shop" class="sec shop">
    <div class="sec-head rv">
      <p class="mono kicker" id="shopKicker"></p>
      <h2 id="shopTitle"></h2>
    </div>
    <div class="toolbar rv">
      <div class="chips" id="chips"></div>
      <div class="tools">

        <label class="srt" id="sortWrap">

            <option value="new">NEWEST</option>
            <option value="low">PRICE ↑</option>
            <option value="high">PRICE ↓</option>
            <option value="az">A — Z</option>
          </select>
        </label>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty mono" id="empty" hidden>— NO RESULT. TRY ANOTHER SEARCH —</p>
    <div class="more" id="more"></div>
  </section>

  <section id="extra" class="sec extra" hidden></section>
  <section id="about" class="sec about"></section>
  <section id="newsletter" class="sec news"></section>
